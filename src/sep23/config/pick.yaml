loop_hz: 20.0                            # for state machine
joint_state_timeout_s: 0.5               # check for new joint state

task:
  stream_timeout_s: 10.0                 # initial check that camera is streaming
  spot_search_s: 60.0                    # give up if no parking spot found
  repark_search_s: 60.0                  # give up if stuck at same parking spot
  retarget_attempts: 10                  # looks from one parking spot to find at least one grasp pose
  park_attempts: 3                       # tries before calling it a failure

jaw:
  settle_tolerance_m: 0.0001              
  settle_time_s: 1.0
  grabbed_margin_m: 0.005                # check that handle is actually grabbed
  timeout_s: 5.0
  catch_reach_m: 0.070                   # params for testing 
  catch_off_centre_m: 0.010              # params for testing
  close_within_m: 0.005
  close_hold_s: 2.0

cloud:
  frames: 5                              # frames for averaging
  frame_timeout_s: 10.0                  # give up if no new frames arrive
  voxel_m: 0.0025                        # 2.5mm voxels 
  crop_margin_m: 1.0
  approach_column: 0
  bar_column: 1
  outlier_filter: true
  handle_carving: true
  corridor_carving: true
  candidate_averaging: true
  obstacle_averaging: true
  flying_pixel: {depth_tolerance_m: 0.003, min_agreeing_neighbours: 5, slope_window_px: 5}
  occupancy: {min_points_per_voxel: 2, free_space_tolerance_m: 0.005, max_surface_tilt_deg: 85.0}
  handle_radius_m: 0.01
  bar_gap_m: 0.015
  corridor: {length_m: 0.05, radius_m: 0.01}
  consensus: {min_frames: 2, match_m: 0.010, max_axis_deg: 20.0, outlier_m: 0.006, max_spread_m: 0.003, duplicate_m: 0.005}
  vote: {min_frames: 2, radius_voxels: 1}

collision:
  link_radius_m: 0.020
  link_step_m: 0.002
  blade_step_m: 0.0025
  grasp_point_from_mount_m: 0.050        # smaller for deeper grasp

park:
  box_xy_m: 1.0                          # 1m x 1m x 0.5m box 
  box_z_m: 0.5
  box_yaw_deg: 45.0
  coarse_step_m: 0.100
  coarse_step_deg: 9.0
  fine_step_m: 0.025
  fine_step_deg: 3.0
  refine_count: 4                        # coarse cells refined around
  standoff_m: [0.30, 0.40]               # a grasp only counts while the camera is this far from it
  screen_count: 3000                     # most poses screened against the obstacle map
  screen_budget_s: 10.0
  screen_blade_stride: 20                # screening every nth blade sample for collision
  exact_count: 10                        # best drivable poses rechecked at full fidelity
  swing_band_deg: 5.0                    # poses this close to the least arm swing count as equal; more holds, then the shorter drive
  transit_samples: 16                    # points along the drive where the arm is checked
  reach_cell_m: 0.002
  speed_m_s: 0.05                        # the simulated vehicle
  yaw_speed_deg_s: 10.0

plan:
  start_tolerance_deg: 1.5               # a start this far past a limit is snapped onto it
  budget_s: 10.0
  goal_budget_s: 0.5                     # per grasp posture
  range_deg: 57.2958                     # longest RRTConnect extension 1 rad max
  edge_step_deg: 1.0                     # collision check spacing along every edge
  seed: 1

follow:
  max_step_deg: 0.5                      # per loop tick, so the speed limit is loop_hz times this
  arrival_tolerance_deg: 1.5
  arrival_timeout_s: 15.0
  blocked_min_step_deg: 0.2              # only joints asked to move at least this far are watched
  blocked_follow_fraction: 0.2           # moving less than this share of the command is a strike
  blocked_strikes: 10

track:                                   # following the target in the image while the arm moves blind
  enabled: true                          # false: no image subscription, the arm moves open loop
  steer: true                            # move the goal to where the tracker puts the target; false only watches
  retarget_m: 0.01                       # retarget once the tracked target is this far from where the arm is heading
  max_shift_m: 0.10                      # a tracked shift past this is taken as a tracking failure and ignored
  replan_budget_s: 0.2                   # no straight way to the shifted goal: plan around it this long, the arm waiting
  depth_gate_m: 0.05                     # either side of the target's depth; the seabed sits ~0.10 m behind the mine face
  roi_radius_m: 0.25                     # from the target, so a tilted seabed's slice of the gate stays out
  min_points: 15                         # fewer consensus corners than this and corners are found again
  max_points: 150
  ransac_px: 2.5                         # 2D reprojection threshold: floating particles and arm edges fall outside it
  min_face_visible: 0.3                  # the face more than 70% blocked: tracking and steering stop, the arm finishes open loop
  ema_alpha: 0.3                         # each frame's weight in the tracked offset steering reads; ~0.3 s lag at 10 Hz, 1 is raw
